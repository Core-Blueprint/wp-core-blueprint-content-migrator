name: Golden validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: Golden safety regression
        run: php tests/golden-safety-regression.php

      - name: Product conformance
        run: php tools/conformance.php

      - name: Release build
        run: bash tools/build-release
