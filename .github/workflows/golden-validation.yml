name: Golden validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: Golden safety regression
        run: php tests/golden-safety-regression.php

      - name: Product conformance
        run: php tools/conformance.php

      - name: Release build
        run: bash tools/build-release

  runtime:
    name: Runtime PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, sodium
          tools: wp-cli

      - name: Install disposable WordPress
        run: |
          wp core download --path=/tmp/wordpress --force
          wp config create             --path=/tmp/wordpress             --dbname=wordpress             --dbuser=root             --dbpass=root             --dbhost=127.0.0.1:3306
          wp core install             --path=/tmp/wordpress             --url=http://content-migrator.test             --title="Content Migrator Runtime"             --admin_user=admin             --admin_password='runtime-test-password'             --admin_email=runtime@example.test             --skip-email

      - name: Install Core Blueprint Base and Content Migrator
        run: |
          git clone --depth 1 https://github.com/Core-Blueprint/wp-core-blueprint.git /tmp/wordpress/wp-content/plugins/core-blueprint
          mkdir -p /tmp/wordpress/wp-content/plugins/core-blueprint-content-migrator
          rsync -a             --exclude='.git/'             --exclude='build/'             "$GITHUB_WORKSPACE/"             /tmp/wordpress/wp-content/plugins/core-blueprint-content-migrator/
          wp plugin activate core-blueprint --path=/tmp/wordpress
          wp cb operator recover 1 --path=/tmp/wordpress
          wp plugin activate core-blueprint-content-migrator --path=/tmp/wordpress

      - name: Run migration runtime regression
        run: wp eval-file "$GITHUB_WORKSPACE/tests/runtime-migration-regression.php" --path=/tmp/wordpress --user=1

