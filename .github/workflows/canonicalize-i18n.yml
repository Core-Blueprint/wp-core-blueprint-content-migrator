name: Canonicalize i18n catalogs

on:
  push:
    branches:
      - golden/localization-release-conformity

permissions:
  contents: write

jobs:
  canonicalize:
    if: ${{ !contains(github.event.head_commit.message, 'i18n: canonicalize catalogs') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: golden/localization-release-conformity
          fetch-depth: 0

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: wp-cli

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Canonicalize catalogs
        run: tools/i18n/update

      - name: Validate generated diff
        run: git diff --check

      - name: Commit canonical catalogs
        run: |
          git config user.name "Core Blueprint CI"
          git config user.email "actions@users.noreply.github.com"
          git add languages/*.pot languages/*.po
          if git diff --cached --quiet; then
            echo "Catalogs already canonical."
            exit 0
          fi
          git commit -m "i18n: canonicalize catalogs"
          git push origin HEAD:golden/localization-release-conformity
